plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        // According to instructions Java 25
        // languageVersion = JavaLanguageVersion.of(25) // Wait for Java 25 support or use latest compatible
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
